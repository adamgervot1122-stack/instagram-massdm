services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oos
      POSTGRES_PASSWORD: oos
      POSTGRES_DB: oos
    ports:
      - "5432:5432"
    volumes:
      - oos_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  agents:
    build:
      context: ../apps/agents
      dockerfile: ../../infra/agents.Dockerfile
    env_file: ../.env
    depends_on: [postgres, redis]
    ports:
      - "8000:8000"
    command: uvicorn opportunity_os.api:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ../apps/web
      dockerfile: ../../infra/web.Dockerfile
    env_file: ../.env
    depends_on: [agents]
    ports:
      - "3000:3000"

volumes:
  oos_pg:
